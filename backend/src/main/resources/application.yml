server:
  port: 1009
  servlet:
    context-path: /agt/api

spring:
  application:
    name: ai-atg-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.0.0.2:3306/ai_atg?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: user
    password:

  redis:
    host: 10.0.0.1
    port: 6379
    password:
    database: 1
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aiatg.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: aiatg
  expiration: 86400000

# MinIO 配置
minio:
  endpoint: http://10.1.3.1:9000
  accessKey: user
  secretKey: user
  bucketName: ai-atg

logging:
  # 日志文件路径（部署时会被外部配置覆盖）
  file:
    path: logs
  level:
    root: INFO
    com.aiatg: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# Selenium 配置
selenium:
  browser: chrome
  headless: true
  implicit-wait: 10
  page-load-timeout: 30
  script-timeout: 30
  screenshot-path: /tmp/screenshots
  auto-download-driver: true

# ATG-Client 配置
atg:
  client:
    url: http://localhost:9999
    timeout: 60000  # 60秒超时

# API Key 加密配置
encryption:
  secret-key: AI-ATG  # 生产环境请修改
  iv: AI-ATG  # 16字节初始化向量，生产环境请修改
